name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The driver-auth tests run against a real PostgreSQL rather than a mock.
    # The schema's constraints are part of what they are checking.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agnext
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agnext

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      # The rule suites and the parity harness run on the runner's Node, not
      # on Bun. Pin it rather than inherit whatever the image happens to ship.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # Both apps consume the rules package's compiled output, so build it first.
      - name: Build shared rules
        run: bun run --filter '@ag/rules' build

      # Typecheck, 34 rule suites, and the differential parity run against the
      # live Apps Script still shipped in packages/rules/legacy. If this fails,
      # the rewrite has drifted from the system that is invoicing real money.
      - name: Verify rules against the live system
        run: bun run --filter '@ag/rules' verify

      - name: Typecheck web
        run: bun run --filter '@ag/web' typecheck

      - name: Typecheck mobile
        run: bun run --filter '@ag/mobile' typecheck

      - name: Apply the schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/0001_init.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/smoke.sql

      - name: Build web
        run: bun run --filter '@ag/web' build

      # Driver sign-in end to end against the real database and a real server.
      - name: Test the API
        run: |
          bun run --filter '@ag/web' start &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          BASE_URL=http://localhost:3000 bun run --filter '@ag/web' test

      # Proves the shared rules still bundle into a phone build.
      - name: Export mobile bundles
        run: bun run --filter '@ag/mobile' export:all
