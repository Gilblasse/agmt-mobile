name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The driver-auth tests run against a real PostgreSQL rather than a mock.
    # The schema's constraints are part of what they are checking.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agnext
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agnext

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      # The rule suites and the parity harness run on the runner's Node, not
      # on Bun. Pin it rather than inherit whatever the image happens to ship.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # Both apps consume the rules package's compiled output, so build it first.
      - name: Build shared rules
        run: bun run --filter '@ag/rules' build

      # Typecheck, 34 rule suites, and the differential parity run against the
      # live Apps Script still shipped in packages/rules/legacy. If this fails,
      # the rewrite has drifted from the system that is invoicing real money.
      - name: Verify rules against the live system
        run: bun run --filter '@ag/rules' verify

      - name: Typecheck web
        run: bun run --filter '@ag/web' typecheck

      - name: Typecheck mobile
        run: bun run --filter '@ag/mobile' typecheck

      - name: Apply the schema
        run: |
          # Every migration, in order. Naming them one by one meant a new
          # migration was silently left out and the tests ran against a schema
          # missing the constraint they depend on.
          for f in db/migrations/*.sql; do
            echo "applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/smoke.sql

      - name: Build web
        run: bun run --filter '@ag/web' build

      # Driver sign-in end to end against the real database and a real server.
      - name: Test the API
        run: |
          bun run --filter '@ag/web' start > /tmp/server.log 2>&1 &
          ready=""
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then ready=yes; break; fi
            sleep 1
          done
          # Without this the loop's last command is `sleep`, which exits 0 even
          # after sixty failed probes, and the real failure then shows up as a
          # confusing pile of connection errors from the tests.
          if [ -z "$ready" ]; then echo "server never became ready:"; cat /tmp/server.log; exit 1; fi
          BASE_URL=http://localhost:3000 bun run --filter '@ag/web' test || { cat /tmp/server.log; exit 1; }

      # Proves the shared rules still bundle into a phone build.
      - name: Export mobile bundles
        run: bun run --filter '@ag/mobile' export:all
